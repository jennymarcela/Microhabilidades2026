<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Microhabilidades 2026 · 2do Grado</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --blue:     #3b82f6; --blue-d: #1d4ed8; --blue-l: #dbeafe;
      --green:    #10b981; --green-d: #047857; --green-l: #d1fae5;
      --orange:   #f59e0b; --orange-d: #b45309; --orange-l: #fef3c7;
      --red:      #ef4444; --red-d: #b91c1c; --red-l: #fee2e2;
      --purple:   #8b5cf6; --purple-d: #6d28d9; --purple-l: #ede9fe;
      --pink:     #ec4899; --pink-l: #fce7f3;
      --teal:     #14b8a6; --teal-l: #ccfbf1;
      --bg:       #f0f9ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Nunito', sans-serif; background: var(--bg); min-height: 100vh; color: #1e293b; }

    header {
      background: white;
      box-shadow: 0 4px 20px rgba(59,130,246,.12);
      padding: 12px 20px;
      position: sticky; top: 0; z-index: 50;
    }
    .header-inner { max-width: 1280px; margin: auto; display: flex; flex-direction: column; gap: 10px; }
    .header-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .logo { background: linear-gradient(135deg, var(--blue), var(--blue-d)); color: white; border-radius: 16px; padding: 10px 14px; font-size: 24px; line-height: 1; box-shadow: 0 4px 10px rgba(59,130,246,0.3); }
    .logo-text h1 { font-size: 18px; font-weight: 900; color: #1e293b; }
    .logo-text p  { font-size: 11px; font-weight: 800; color: var(--blue); letter-spacing: .06em; text-transform: uppercase; }
    
    .tri-selector { display: flex; gap: 6px; background: #f1f5f9; padding: 4px; border-radius: 999px; margin-left: 10px; }
    .tri-btn {
      padding: 6px 14px; border-radius: 999px; border: none; background: transparent;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px; color: #64748b;
      cursor: pointer; transition: all .2s;
    }
    .tri-btn.active { background: var(--blue); color: white; box-shadow: 0 2px 8px rgba(59,130,246,0.3); }

    .score-pill {
      margin-left: auto;
      background: var(--orange-l);
      border: 2px solid var(--orange);
      color: var(--orange-d);
      font-weight: 800;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 999px;
      display: flex; align-items: center; gap: 6px;
    }

    .week-nav { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; }
    .week-nav::-webkit-scrollbar { display: none; }
    .week-btn-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .week-btn {
      padding: 6px 14px; border-radius: 999px; border: 2px solid #e2e8f0;
      background: white; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 12px;
      color: #64748b; cursor: pointer; white-space: nowrap; transition: all .18s;
    }
    .week-btn:hover  { border-color: var(--blue); color: var(--blue); }
    .week-btn.active { background: var(--blue); border-color: var(--blue); color: white; box-shadow: 0 3px 10px rgba(59,130,246,0.25); }
    .week-btn.reinforcement { background: #fef08a; border-color: #eab308; color: #854d0e; }
    .week-btn.reinforcement.active { background: #eab308; border-color: #ca8a04; color: white; }

    .app { max-width: 1280px; margin: 20px auto; padding: 0 16px 40px; display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
    @media(max-width:768px){ .app { grid-template-columns: 1fr; } }

    .sidebar { background: white; border-radius: 24px; padding: 16px 12px; border: 1.5px solid #e0effe; height: fit-content; position: sticky; top: 120px; box-shadow: 0 4px 16px rgba(0,0,0,0.02); }
    .sidebar-title { font-size: 11px; font-weight: 900; color: #94a3b8; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; padding: 0 8px; }
    .sub-btn {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 10px 12px; border-radius: 16px; border: none; background: transparent;
      cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px;
      color: #475569; transition: all .18s; text-align: left; margin-bottom: 4px;
    }
    .sub-btn:hover  { background: #f1f5f9; color: var(--blue-d); }
    .sub-btn.active { background: var(--blue-l); color: var(--blue-d); box-shadow: 0 0 0 2px var(--blue); }
    .sub-btn .ico   { font-size: 20px; width: 28px; text-align: center; }

    .content-header { margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
    .content-header h2 { font-size: 28px; font-weight: 900; color: #1e293b; }
    .content-header p  { font-size: 14px; color: #64748b; font-weight: 700; margin-top: 2px; }

    .ex-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    @media(max-width:640px){ .ex-grid { grid-template-columns: 1fr; } }

    .card {
      background: white; border-radius: 24px; padding: 22px;
      border: 2.5px solid #e0effe; display: flex; flex-direction: column; gap: 16px;
      transition: transform .2s, box-shadow .2s; position: relative;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(59,130,246,.12); }
    .card.correct { border-color: var(--green) !important; background: var(--green-l) !important; }
    .card.incorrect-flash { border-color: var(--red); animation: shake .3s; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

    .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .micro-badge {
      font-size: 10.5px; font-weight: 900; padding: 4px 12px; border-radius: 999px;
      text-transform: uppercase; letter-spacing: .05em; line-height: 1.3;
    }
    .speak-btn {
      background: var(--blue-l); border: none; border-radius: 999px;
      padding: 8px; cursor: pointer; color: var(--blue-d); flex-shrink: 0;
      transition: background .15s, transform .1s; display: flex; align-items: center; justify-content: center;
    }
    .speak-btn:hover  { background: var(--blue); color: white; transform: scale(1.05); }
    .speak-btn:active { transform: scale(.9); }
    .instruccion { font-size: 15px; font-weight: 800; color: #1e293b; line-height: 1.45; }

    .opts { display: flex; flex-direction: column; gap: 8px; }
    .opt-btn {
      width: 100%; text-align: left; padding: 10px 16px; border-radius: 14px;
      border: 2px solid #e2e8f0; background: #f8fafc; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 14px; color: #334155;
      transition: all .15s;
    }
    .opt-btn:hover         { border-color: var(--blue); background: var(--blue-l); color: var(--blue-d); }
    .opt-btn.opt-correct   { border-color: var(--green); background: var(--green-l); color: var(--green-d); }
    .opt-btn.opt-incorrect { border-color: var(--red);   background: var(--red-l);   color: var(--red-d); }

    .tf-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .tf-btn {
      padding: 12px; border-radius: 16px; border: 2.5px solid; cursor: pointer;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px; transition: all .15s; text-align: center;
    }
    .tf-true  { border-color: #a7f3d0; background: #f0fdf4; color: #065f46; }
    .tf-false { border-color: #fca5a5; background: #fff5f5; color: #991b1b; }
    .tf-true:hover  { background: var(--green); color: white; border-color: var(--green); }
    .tf-false:hover { background: var(--red);   color: white; border-color: var(--red); }

    .fill-row { display: flex; gap: 8px; }
    .fill-input {
      flex: 1; padding: 10px 14px; border-radius: 14px; border: 2.5px solid #e2e8f0;
      font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 15px; outline: none;
      transition: border-color .2s;
    }
    .fill-input:focus { border-color: var(--blue); }
    .fill-input.wrong { border-color: var(--red); animation: shake .3s; }
    .ok-btn {
      background: var(--blue); color: white; border: none; border-radius: 14px;
      padding: 10px 18px; font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 14px;
      cursor: pointer; transition: background .15s;
    }
    .ok-btn:hover { background: var(--blue-d); }

    .pieces { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
    .piece {
      background: #fff7ed; color: #c2410c; border: 2.5px solid #fed7aa;
      border-radius: 14px; padding: 8px 14px; cursor: grab;
      font-weight: 800; font-size: 13px; user-select: none; transition: all .15s;
    }
    .piece:hover { background: var(--orange); color: white; border-color: var(--orange); }
    .piece.used  { opacity: .35; cursor: default; }
    .dropzone {
      min-height: 52px; border: 2.5px dashed #cbd5e1; border-radius: 16px;
      background: #f8fafc; display: flex; flex-wrap: wrap; gap: 8px;
      align-items: center; padding: 10px; transition: all .15s;
    }
    .dropzone.dragover { border-color: var(--blue); background: var(--blue-l); }
    .dropzone-hint { color: #94a3b8; font-size: 12px; font-weight: 800; pointer-events: none; }
    .placed {
      background: var(--blue); color: white; border-radius: 999px;
      padding: 5px 14px; font-size: 12px; font-weight: 900;
    }

    .loading-card {
      background: white; border-radius: 24px; padding: 32px 20px;
      border: 2.5px solid #e0effe; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px; min-height: 200px;
    }
    .spinner {
      width: 44px; height: 44px; border: 5px solid var(--blue-l);
      border-top-color: var(--blue); border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-weight: 900; color: var(--blue); font-size: 15px; text-align: center; }

    #modal {
      position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 200; padding: 16px;
    }
    #modal.show { display: flex; }
    .modal-box {
      background: white; border-radius: 32px; padding: 40px 32px;
      max-width: 380px; width: 100%; text-align: center;
      box-shadow: 0 24px 60px rgba(0,0,0,.25); animation: popIn .25s ease;
    }
    @keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }
    .modal-icon { font-size: 64px; margin-bottom: 12px; animation: bounce 1s infinite alternate; }
    @keyframes bounce { to { transform: translateY(-8px); } }
    .modal-title { font-size: 26px; font-weight: 900; color: var(--blue-d); margin-bottom: 8px; }
    .modal-msg   { font-size: 15px; color: #475569; font-weight: 700; margin-bottom: 24px; }
    .modal-close {
      width: 100%; background: var(--blue); color: white;
      border: none; border-radius: 16px; padding: 14px;
      font-family: 'Nunito', sans-serif; font-weight: 900; font-size: 16px;
      cursor: pointer; transition: background .15s;
    }
    .modal-close:hover { background: var(--blue-d); }
    .check-overlay { font-size: 20px; text-align: center; font-weight: 900; color: var(--green-d); padding: 8px; }

    /* Clasificar en columnas */
    .classify-wrap { display: flex; flex-direction: column; gap: 12px; }
    .classify-pool { display: flex; flex-wrap: wrap; gap: 8px; }
    .classify-piece {
      background: #fff7ed; color: #c2410c; border: 2.5px solid #fed7aa;
      border-radius: 14px; padding: 8px 14px; cursor: pointer;
      font-weight: 800; font-size: 13px; user-select: none; transition: all .15s;
    }
    .classify-piece:hover { background: var(--orange); color: white; border-color: var(--orange); }
    .classify-piece.selected { background: var(--orange); color: white; border-color: var(--orange); transform: scale(1.05); box-shadow: 0 0 0 3px var(--orange-l); }
    .classify-piece.wrong-piece { border-color: var(--red); background: var(--red-l); color: var(--red-d); }
    .classify-piece.placed-hidden { display: none; }
    .classify-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .classify-col {
      min-height: 100px; border: 2.5px dashed #cbd5e1; border-radius: 16px;
      background: #f8fafc; padding: 10px; display: flex; flex-direction: column; gap: 6px;
      transition: all .15s; cursor: pointer;
    }
    .classify-col.dragover { border-color: var(--blue); background: var(--blue-l); }
    .classify-col-title {
      font-size: 11.5px; font-weight: 900; text-align: center; padding: 6px 8px;
      border-radius: 10px; margin-bottom: 2px; background: var(--blue-l); color: var(--blue-d);
    }
    .classify-item-placed {
      background: var(--blue); color: white; border-radius: 999px;
      padding: 5px 12px; font-size: 12px; font-weight: 900; align-self: flex-start;
    }

    /* Emparejar (matching) */
    .match-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .match-col { display: flex; flex-direction: column; gap: 8px; }
    .match-item {
      padding: 10px 12px; border-radius: 14px; border: 2.5px solid #e2e8f0;
      background: #f8fafc; cursor: pointer; font-weight: 800; font-size: 13px;
      text-align: center; transition: all .15s;
    }
    .match-item:hover { border-color: var(--blue); }
    .match-item.selected { border-color: var(--blue); background: var(--blue-l); color: var(--blue-d); }
    .match-item.matched { border-color: var(--green); background: var(--green-l); color: var(--green-d); cursor: default; opacity: .9; }
    .match-item.wrong-flash { animation: shake .3s; border-color: var(--red); background: var(--red-l); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">🎓</div>
      <div class="logo-text">
        <h1>Microhabilidades 2026</h1>
        <p id="sub-header-tag">Segundo Grado · Evergreen School</p>
      </div>

      <!-- Trimester Tabs -->
      <div class="tri-selector">
        <button class="tri-btn" id="tri-btn-1" onclick="changeTrimester(1)">I Trimestre</button>
        <button class="tri-btn" id="tri-btn-2" onclick="changeTrimester(2)">II Trimestre</button>
        <button class="tri-btn" id="tri-btn-3" onclick="changeTrimester(3)">III Trimestre</button>
      </div>

      <div class="score-pill">⭐ <span id="score-display">0</span> pts · <span id="done-display">0</span> misiones</div>
    </div>
    <nav class="week-nav" id="week-nav"></nav>
  </div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-title">Materias</div>
    <div id="subject-nav"></div>
  </aside>

  <main class="content">
    <div class="content-header">
      <div>
        <h2 id="main-title">Cargando...</h2>
        <p id="main-sub">Selecciona una materia y semana</p>
      </div>
    </div>
    <div class="ex-grid" id="ex-grid"></div>
  </main>
</div>

<!-- Modal for Exercise Completion Feedback -->
<div id="modal">
  <div class="modal-box">
    <div class="modal-icon" id="m-icon">🌟</div>
    <h3 class="modal-title" id="m-title">¡Excelente!</h3>
    <p class="modal-msg" id="m-msg">¡Completaste este ejercicio!</p>
    <button class="modal-close" onclick="closeModal()">¡Seguir aprendiendo! 🚀</button>
  </div>
</div>

<script>

  { id:'eng', nombre:'English A1',       ico:'🌎', lang:'en-US', color:'#10b981', badge:'#d1fae5',badgeText:'#065f46' },

  { id:'mat', nombre:'Math',             ico:'➗', lang:'en-US', color:'#f59e0b', badge:'#fef3c7',badgeText:'#78350f' },
  { id:'soc', nombre:'Social Studies',   ico:'🌍', lang:'en-US', color:'#ec4899', badge:'#fce7f3',badgeText:'#9d174d' },
  { id:'art', nombre:'Art & Expression', ico:'🎨', lang:'en-US', color:'#f97316', badge:'#ffedd5',badgeText:'#7c2d12' },
  { id:'stm', nombre:'STEAM · Coding',   ico:'💻', lang:'en-US', color:'#6366f1', badge:'#e0e7ff',badgeText:'#3730a3' },
];

const S = {
  trimester: 3,
  week: 1,
  materia: 'esp',
  score: 0,
  done: 0,
  studentName: '',
  completed: {},
  attempts: {},
  weekData: Object.fromEntries(Array.from({length:9},(_,i)=>[i+1,{pts:0,done:0}]))
};

function speakPhonics(text, lang = 'es-ES') {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang  = lang;
  u.rate  = 0.9;   // Paused, clear rate for 7-8 year olds
  u.pitch = 1.05;  // Friendly tone
  u.volume= 1.0;
  const voices = window.speechSynthesis.getVoices();
  const match = voices.find(v => v.lang.startsWith(lang.split('-')[0]) && !v.name.toLowerCase().includes('compact'));
  if (match) u.voice = match;
  window.speechSynthesis.speak(u);
}
window.speechSynthesis.onvoiceschanged = () => {};

  },

    9: ["Story Comprehension", "Audio Instructions", "Vocabulary Review", "Final Presentation"]
  },

    1: ["Long I Sound /aɪ/", "Spelling Patterns", "Sound Recognition", "Word Matching"],
    2: ["Personal Glossary", "Story Vocabulary", "Comprehension Questions", "Word Meanings"],
    3: ["Long O Sound /oʊ/", "Word Families", "Spelling Rules", "Vowel Patterns"],
    4: ["Spelling Inference", "CVC /b-æ-t/ Sounds", "Pattern Spotting", "Phonics Rules"],
    5: ["Rhyming Patterns", "Phonics Sentences", "Sound Discrimination", "Spelling Accuracy"],

function getExercisesForWeek(tri, matId, week) {
  const mat = MATERIAS.find(m => m.id === matId);
  const isEn = mat.lang === 'en-US';
  const themes = (SKILL_THEMES[matId] && SKILL_THEMES[matId][week]) || ["Tema 1", "Tema 2", "Tema 3", "Tema 4"];
  const triLabel = isEn ? `Trimester ${tri}` : `Trimestre ${tri}`;
  const raw = (EXERCISES_DATA[matId] && EXERCISES_DATA[matId][week]) || [];
  return raw.map((ex, i) => Object.assign({}, ex, { micro: `${triLabel} · ${themes[i] || ''}` }));
}

async function renderExercises() {
  const grid = document.getElementById('ex-grid');
  const mat  = MATERIAS.find(m => m.id === S.materia);

  grid.innerHTML = Array(4).fill(0).map(() => `
    <div class="loading-card">
      <div class="spinner"></div>
      <div class="loading-text">⚡ Cargando misiones neurodidácticas...</div>
    </div>
  `).join('');

  try {
    const exercises = getExercisesForWeek(S.trimester, S.materia, S.week);
    const subtitleText = `Trimestre ${S.trimester} · Semana ${S.week} · 4 Misiones Interactivas`;
    document.getElementById('main-sub').textContent = subtitleText;
    
    grid.innerHTML = '';
    exercises.forEach((ex, i) => {
      const cardId = `card-t${S.trimester}-w${S.week}-${S.materia}-${i}`;
      const card = document.createElement('div');
      card.className = 'card';
      card.id = cardId;
      
      const badgeColor = S.week === 6 ? '#fef08a' : mat.badge;
      const badgeTextColor = S.week === 6 ? '#854d0e' : mat.badgeText;

      card.innerHTML = `
        <div class="card-top">
          <span class="micro-badge" style="background:${badgeColor};color:${badgeTextColor}">${ex.micro}</span>
          <button class="speak-btn" onclick="speakPhonics('${(ex.audioTexto||'').replace(/'/g,"\\'")}','${mat.lang}')" title="Escuchar pronunciación">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
            </svg>
          </button>
        </div>
        <p class="instruccion">${ex.instruccion}</p>
        <div class="action-zone" id="az-${cardId}">
          ${buildActionZone(ex, cardId)}
        </div>
      `;

      card._ex = ex;
      card._dropped = [];
      grid.appendChild(card);

      const key = `${S.trimester}-${S.materia}-${S.week}-${i}`;
      if (S.completed[key]) {
        restoreCompletedCard(card, S.completed[key]);
      }
    });
  } catch(e) {
    grid.innerHTML = `<div class="error-card">⚠️ Error al cargar misiones. Intenta de nuevo.</div>`;
  }
}

function buildActionZone(ex, cardId) {
  if (ex.tipo === 'multiple-choice') {
    return `<div class="opts">${ex.opciones.map(opt =>
      `<button class="opt-btn" onclick="checkMC('${cardId}','${esc(opt)}','${esc(ex.correcta)}')">${opt}</button>`
    ).join('')}</div>`;
  }
  if (ex.tipo === 'fill-blank') {
    return `<div class="fill-row">
      <input id="inp-${cardId}" type="text" class="fill-input" placeholder="Escribe aquí..." autocomplete="off" autocorrect="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')checkFill('${cardId}','${esc(ex.correcta)}')" />
      <button class="ok-btn" onclick="checkFill('${cardId}','${esc(ex.correcta)}')">OK ✓</button>
    </div>`;
  }
  if (ex.tipo === 'true-false') {
    const mat = MATERIAS.find(m => m.id === S.materia);
    const isEn = mat.lang === 'en-US';
    return `<div class="tf-row">
      <button class="tf-btn tf-true"  onclick="checkTF('${cardId}',true,${ex.correcta})">✅ ${isEn ? 'True' : 'Verdadero'}</button>
      <button class="tf-btn tf-false" onclick="checkTF('${cardId}',false,${ex.correcta})">❌ ${isEn ? 'False' : 'Falso'}</button>
    </div>`;
  }
  if (ex.tipo === 'drag-drop') {
    const piezasHTML = (ex.piezas||[]).map(p =>
      `<div class="piece" draggable="true" data-val="${esc(p)}"
        ondragstart="dStart(event)"
        onclick="dClick(event,'${cardId}')">
        ${p}
      </div>`
    ).join('');
    const correctaJSON = JSON.stringify(ex.correcta||[]).replace(/"/g,'&quot;');
    const mat = MATERIAS.find(m => m.id === S.materia);
    const isEn = mat.lang === 'en-US';
    return `
      <div class="pieces" id="pieces-${cardId}">${piezasHTML}</div>
      <div class="dropzone" id="drop-${cardId}"
        ondragover="event.preventDefault();this.classList.add('dragover')"
        ondragleave="this.classList.remove('dragover')"
        ondrop="dDrop(event,'${cardId}',${correctaJSON})">
        <span class="dropzone-hint">👆 ${isEn ? 'Drag the pieces here in order' : 'Arrastra las piezas en orden aquí'}</span>
      </div>
    `;
  }
  if (ex.tipo === 'classify') return buildClassify(ex, cardId);
  if (ex.tipo === 'match')    return buildMatch(ex, cardId);
  return '';
}

// ---------- Clasificar en columnas (drag & tap) ----------
function buildClassify(ex, cardId) {
  const itemsHTML = ex.items.map((it, idx) => `
    <div class="classify-piece" draggable="true" data-idx="${idx}"
      ondragstart="cDragStart(event,${idx})"
      onclick="classifySelect(this,'${cardId}',${idx})">${it.text}</div>
  `).join('');
  return `
    <div class="classify-wrap">
      <div class="classify-pool" id="pool-${cardId}">${itemsHTML}</div>
      <div class="classify-cols">
        <div class="classify-col" id="col-${cardId}-A"
          ondragover="event.preventDefault();this.classList.add('dragover')"
          ondragleave="this.classList.remove('dragover')"
          ondrop="classifyDrop(event,'${cardId}','A')"
          onclick="classifyPlace('${cardId}','A')">
          <div class="classify-col-title">${esc(ex.colA)}</div>
        </div>
        <div class="classify-col" id="col-${cardId}-B"
          ondragover="event.preventDefault();this.classList.add('dragover')"
          ondragleave="this.classList.remove('dragover')"
          ondrop="classifyDrop(event,'${cardId}','B')"
          onclick="classifyPlace('${cardId}','B')">
          <div class="classify-col-title">${esc(ex.colB)}</div>
        </div>
      </div>
    </div>
  `;
}

let _classifySelected = {};
let _cDragIdx = null;

function cDragStart(ev, idx) { _cDragIdx = idx; }

function classifySelect(el, cardId, idx) {
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct') || el.classList.contains('placed-hidden')) return;
  document.querySelectorAll(`#pool-${cardId} .classify-piece`).forEach(p => p.classList.remove('selected'));
  el.classList.add('selected');
  _classifySelected[cardId] = idx;
}

function classifyPlace(cardId, col) {
  const idx = _classifySelected[cardId];
  if (idx === undefined) return;
  resolveClassify(cardId, idx, col);
}

function classifyDrop(ev, cardId, col) {
  ev.preventDefault();
  const zone = document.getElementById(`col-${cardId}-${col}`);
  zone.classList.remove('dragover');
  const idx = _cDragIdx;
  if (idx === null || idx === undefined) return;
  resolveClassify(cardId, idx, col);
}

function resolveClassify(cardId, idx, col) {
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct')) return;
  const ex = card._ex;
  const item = ex.items[idx];
  if (!item) return;
  const pieceEl = document.querySelector(`#pool-${cardId} .classify-piece[data-idx="${idx}"]`);
  if (!pieceEl || pieceEl.classList.contains('placed-hidden')) return;
  const targetCol = document.getElementById(`col-${cardId}-${col}`);

  if (item.col === col) {
    pieceEl.classList.add('placed-hidden');
    pieceEl.classList.remove('selected');
    const chip = document.createElement('div');
    chip.className = 'classify-item-placed';
    chip.textContent = item.text;
    targetCol.appendChild(chip);
    card._classified = (card._classified || 0) + 1;
    delete _classifySelected[cardId];
    _cDragIdx = null;
    if (card._classified === ex.items.length) markCorrect(card);
  } else {
    S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
    pieceEl.classList.remove('selected');
    pieceEl.classList.add('wrong-piece');
    card.classList.add('incorrect-flash');
    setTimeout(() => { pieceEl.classList.remove('wrong-piece'); card.classList.remove('incorrect-flash'); }, 500);
    delete _classifySelected[cardId];
    _cDragIdx = null;
    const mat = MATERIAS.find(m => m.id === S.materia);
    speakPhonics(mat.lang === 'en-US' ? 'Try again!' : '¡Inténtalo de nuevo!', mat.lang);
  }
}

// ---------- Emparejar (matching) ----------
function shuffleArr(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildMatch(ex, cardId) {
  const leftHTML = ex.pairs.map((p, i) =>
    `<div class="match-item" data-side="L" data-idx="${i}" onclick="matchSelect(this,'${cardId}','L',${i})">${esc(p.left)}</div>`
  ).join('');
  const shuffledRight = shuffleArr(ex.pairs.map((p, i) => ({ text: p.right, idx: i })));
  const rightHTML = shuffledRight.map(r =>
    `<div class="match-item" data-side="R" data-idx="${r.idx}" onclick="matchSelect(this,'${cardId}','R',${r.idx})">${esc(r.text)}</div>`
  ).join('');
  return `<div class="match-wrap"><div class="match-col">${leftHTML}</div><div class="match-col">${rightHTML}</div></div>`;
}

let _matchSel = {};

function matchSelect(el, cardId, side, idx) {
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct') || el.classList.contains('matched')) return;
  const sel = _matchSel[cardId];

  if (!sel) {
    card.querySelectorAll('.match-item').forEach(m => m.classList.remove('selected'));
    el.classList.add('selected');
    _matchSel[cardId] = { side, idx, el };
    return;
  }
  if (sel.side === side) {
    sel.el.classList.remove('selected');
    el.classList.add('selected');
    _matchSel[cardId] = { side, idx, el };
    return;
  }
  if (sel.idx === idx) {
    sel.el.classList.remove('selected');
    sel.el.classList.add('matched');
    el.classList.add('matched');
    delete _matchSel[cardId];
    card._matched = (card._matched || 0) + 1;
    const ex = card._ex;
    if (card._matched === ex.pairs.length) markCorrect(card);
  } else {
    S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
    const selEl = sel.el;
    selEl.classList.add('wrong-flash');
    el.classList.add('wrong-flash');
    setTimeout(() => {
      selEl.classList.remove('selected', 'wrong-flash');
      el.classList.remove('wrong-flash');
    }, 500);
    delete _matchSel[cardId];
    const mat = MATERIAS.find(m => m.id === S.materia);
    speakPhonics(mat.lang === 'en-US' ? 'Try again!' : '¡Inténtalo de nuevo!', mat.lang);
  }
}

function esc(str) {
  return String(str||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'\\"');
}

function checkMC(cardId, val, correct) {
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct')) return;
  const isOk = val.toLowerCase().trim() === correct.toLowerCase().trim();
  const btns = card.querySelectorAll('.opt-btn');
  btns.forEach(b => b.disabled = true);

  if (isOk) {
    btns.forEach(b => { if (b.textContent.trim().toLowerCase() === correct.toLowerCase().trim()) b.classList.add('opt-correct'); });
    markCorrect(card);
  } else {
    S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
    const clicked = [...btns].find(b => b.textContent.trim().toLowerCase() === val.toLowerCase().trim());
    if (clicked) clicked.classList.add('opt-incorrect');
    setTimeout(() => { btns.forEach(b => { b.classList.remove('opt-incorrect'); b.disabled = false; }); }, 900);
  }
}

function checkFill(cardId, correct) {
  const card  = document.getElementById(cardId);
  if (card.classList.contains('correct')) return;
  const inp   = document.getElementById(`inp-${cardId}`);
  const val   = (inp.value||'').trim().toLowerCase();
  const okVal = correct.toLowerCase().trim();

  if (val === okVal || val.includes(okVal)) {
    markCorrect(card);
  } else {
    S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
    inp.classList.add('wrong');
    setTimeout(() => { inp.classList.remove('wrong'); inp.value = ''; inp.focus(); }, 800);
  }
}

function checkTF(cardId, val, correct) {
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct')) return;
  if (val === correct) {
    markCorrect(card);
  } else {
    S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
    card.classList.add('incorrect-flash');
    setTimeout(() => card.classList.remove('incorrect-flash'), 400);
    const mat = MATERIAS.find(m => m.id === S.materia);
    speakPhonics(mat.lang === 'en-US' ? 'Try again!' : '¡Inténtalo de nuevo!', mat.lang);
  }
}

let _dragVal = null;
function dStart(ev) { _dragVal = ev.target.dataset.val; }
function dClick(ev, cardId) {
  const val = ev.currentTarget.dataset.val;
  const zone = document.getElementById(`drop-${cardId}`);
  _dragVal = val;
  zone.dispatchEvent(Object.assign(new Event('drop'), { preventDefault:()=>{}, dataTransfer:{ getData: ()=>val } }));
}

function dDrop(ev, cardId, correctArr) {
  ev.preventDefault();
  const zone = document.getElementById(`drop-${cardId}`);
  zone.classList.remove('dragover');
  const card = document.getElementById(cardId);
  if (card.classList.contains('correct')) return;

  const val  = ev.dataTransfer?.getData('text') || _dragVal;
  if (!val) return;

  const pieces = document.querySelectorAll(`#pieces-${cardId} .piece`);
  pieces.forEach(p => { if (p.dataset.val === val && !p.classList.contains('used')) { p.classList.add('used'); } });

  const hint = zone.querySelector('.dropzone-hint');
  if (hint) hint.remove();

  const placed = document.createElement('span');
  placed.className = 'placed';
  placed.textContent = val;
  zone.appendChild(placed);

  card._dropped = card._dropped || [];
  card._dropped.push(val);

  if (card._dropped.length === correctArr.length) {
    const ok = JSON.stringify(card._dropped) === JSON.stringify(correctArr);
    if (ok) {
      markCorrect(card);
    } else {
      S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
      const mat = MATERIAS.find(m => m.id === S.materia);
      const isEn = mat.lang === 'en-US';
      zone.innerHTML = `<span class="dropzone-hint">👆 ${isEn ? 'Drag the pieces here' : 'Arrastra las piezas aquí'}</span>`;
      card._dropped = [];
      pieces.forEach(p => p.classList.remove('used'));
      card.classList.add('incorrect-flash');
      setTimeout(() => card.classList.remove('incorrect-flash'), 400);
      speakPhonics(isEn ? 'Check the order and try again!' : '¡Revisa el orden e inténtalo de nuevo!', mat.lang);
    }
  }
}

function exKey(cardId) {
  return `${S.trimester}-${S.materia}-${S.week}-${cardId.split('-').pop()}`;
}

function markCorrect(card) {
  const cardId   = card.id;
  const key      = exKey(cardId);
  const alreadyDone = !!S.completed[key];

  S.attempts[cardId] = (S.attempts[cardId] || 0) + 1;
  const attempts = S.attempts[cardId];
  const ex = card._ex || {};
  S.completed[key] = { attempts, correcta: ex.correcta || '', tipo: ex.tipo || '' };

  card.classList.add('correct');
  card.querySelectorAll('button,input').forEach(el => el.disabled = true);
  card.querySelectorAll('.piece').forEach(p => p.setAttribute('draggable','false'));

  const az = card.querySelector('.action-zone');
  const attemptTxt = attempts === 1 ? '¡Al primer intento! 🎯' : `${attempts} intentos`;
  if (az) {
    az.innerHTML = `<div class="check-overlay">✅ ¡Excelente! · <span style="font-size:12px;opacity:.8;">${attemptTxt}</span></div>`;
  }

  if (!alreadyDone) {
    S.score += 10;
    S.done  += 1;
    S.weekData[S.week].pts  += 10;
    S.weekData[S.week].done += 1;
    document.getElementById('score-display').textContent = S.score;
    document.getElementById('done-display').textContent  = S.done;
    updateWeekBadge(S.week);
  }

  saveProgress();

  if (!alreadyDone) {
    const msgs = ['¡Fantástico trabajo! 🌟','¡Lo lograste! 🏆','¡Excelente progreso! 🦄','¡Eres un superestrella! 🧠','¡Misión Cumplida! ⭐'];
    const msg = msgs[Math.floor(Math.random()*msgs.length)];
    document.getElementById('m-icon').textContent  = '🌟';
    document.getElementById('m-title').textContent = msg;
    document.getElementById('m-msg').textContent   = `¡Misión completada con éxito! ${attemptTxt}`;
    speakPhonics(msg, 'es-ES');
    document.getElementById('modal').classList.add('show');
  }
}

function restoreCompletedCard(card, data) {
  card.classList.add('correct');
  card.querySelectorAll('button,input').forEach(el => el.disabled = true);
  const az = card.querySelector('.action-zone');
  if (az) az.innerHTML = `<div class="check-overlay">✅ ¡Misión Completada!</div>`;
}

function closeModal() {
  document.getElementById('modal').classList.remove('show');
}

function changeTrimester(triNum) {
  S.trimester = triNum;
  for (let i = 1; i <= 3; i++) {
    document.getElementById(`tri-btn-${i}`).classList.toggle('active', i === triNum);
  }
  document.getElementById('sub-header-tag').textContent = `Segundo Grado · Trimestre ${triNum} · Evergreen School`;
  updateUI();
}

function initNav() {
  const wn = document.getElementById('week-nav');
  wn.innerHTML = '';
  for (let i = 1; i <= 9; i++) {
    const wrap = document.createElement('div');
    wrap.className = 'week-btn-wrap';
    const b = document.createElement('button');
    let classes = 'week-btn';
    if (i === 6) classes += ' reinforcement';
    if (S.week === i) classes += ' active';
    
    b.className = classes;
    b.textContent = i === 6 ? `S6: 🎮 Refuerzo` : `Semana ${i}`;
    b.onclick = () => { S.week = i; updateUI(); };
    
    const badge = document.createElement('span');
    badge.id = `wbadge-${i}`;
    badge.style.cssText = 'font-size:10px;font-weight:800;color:#64748b;white-space:nowrap;min-height:14px;';
    
    wrap.appendChild(b);
    wrap.appendChild(badge);
    wn.appendChild(wrap);
  }

  const sn = document.getElementById('subject-nav');
  sn.innerHTML = '';
  MATERIAS.forEach(m => {
    const b = document.createElement('button');
    b.className = `sub-btn${S.materia===m.id?' active':''}`;
    b.innerHTML = `<span class="ico">${m.ico}</span><span>${m.nombre}</span>`;
    b.onclick = () => { S.materia = m.id; updateUI(); };
    sn.appendChild(b);
  });
}

function updateUI() {
  document.querySelectorAll('.week-btn').forEach((b,i) => {
    b.classList.toggle('active', S.week === i+1);
  });
  document.querySelectorAll('.sub-btn').forEach((b,i) => {
    b.classList.toggle('active', S.materia === MATERIAS[i].id);
  });

  const mat = MATERIAS.find(m => m.id === S.materia);
  document.getElementById('main-title').textContent = `${mat.ico} ${mat.nombre}`;
  renderExercises();
}

function lsKey(name) { return `mh2026_${name.trim().toLowerCase().replace(/\s+/g,'_')}`; }

function saveProgress() {
  if (!S.studentName) return;
  const data = { score: S.score, done: S.done, weekData: S.weekData, completed: S.completed, attempts: S.attempts };
  localStorage.setItem(lsKey(S.studentName), JSON.stringify(data));
}

function loadProgress(name) {
  const raw = localStorage.getItem(lsKey(name));
  if (!raw) return;
  try {
    const data = JSON.parse(raw);
    S.score     = data.score     || 0;
    S.done      = data.done      || 0;
    S.weekData  = data.weekData  || S.weekData;
    S.completed = data.completed || {};
    S.attempts  = data.attempts  || {};
    document.getElementById('score-display').textContent = S.score;
    document.getElementById('done-display').textContent  = S.done;
    for (let w = 1; w <= 9; w++) updateWeekBadge(w);
  } catch(e) {}
}

function updateWeekBadge(w) {
  const el = document.getElementById(`wbadge-${w}`);
  if (!el) return;
  const d = S.weekData[w];
  if (d && d.pts > 0) {
    el.textContent = `⭐ ${d.pts} pts`;
    el.style.color = w === 6 ? '#ca8a04' : '#1d4ed8';
  } else {
    el.textContent = '';
  }
}

function showNameModal() {
  if (!document.getElementById('nm-style')) {
    const st = document.createElement('style');
    st.id = 'nm-style';
    st.textContent = `
      #nm-overlay { position:fixed;inset:0;background:rgba(15,23,42,.7);backdrop-filter:blur(4px);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px; }
      #nm-box { background:white;border-radius:32px;padding:40px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:popIn .25s ease; }
      #nm-box h2 { font-size:24px;font-weight:900;color:#1e293b;margin-bottom:8px; }
      #nm-box p  { font-size:14px;color:#64748b;font-weight:700;margin-bottom:24px; }
      #nm-input  { width:100%;padding:14px 18px;border:2.5px solid #e2e8f0;border-radius:16px;font-family:'Nunito',sans-serif;font-weight:800;font-size:16px;outline:none;margin-bottom:14px;transition:border-color .2s;box-sizing:border-box; }
      #nm-input:focus { border-color:#3b82f6; }
      #nm-go { width:100%;background:#3b82f6;color:white;border:none;border-radius:16px;padding:14px;font-family:'Nunito',sans-serif;font-weight:900;font-size:16px;cursor:pointer;transition:background .15s; }
      #nm-go:hover { background:#1d4ed8; }
      #nm-emoji { font-size:56px;margin-bottom:12px; }
    `;
    document.head.appendChild(st);
  }

  const ov = document.createElement('div');
  ov.id = 'nm-overlay';
  ov.innerHTML = `
    <div id="nm-box">
      <div id="nm-emoji">🚀</div>
      <h2>¡Bienvenido Antonio!</h2>
      <p>Ingresa tu nombre para guardar tus estrellas y misiones completadas 🌟</p>
      <input id="nm-input" type="text" placeholder="Escribe 'Antonio' aquí..." value="Antonio" maxlength="30" autocomplete="off" />
      <button id="nm-go" onclick="startSession()">¡Empezar Aventura! 🎮</button>
    </div>
  `;
  document.body.appendChild(ov);

  const inp = document.getElementById('nm-input');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') startSession(); });
}

function startSession() {
  const inp = document.getElementById('nm-input');
  const name = (inp.value || '').trim();
  if (!name) { inp.style.borderColor='#ef4444'; inp.focus(); return; }
  S.studentName = name;
  document.getElementById('nm-overlay').remove();
  loadProgress(name);
}

window.onload = () => {
  changeTrimester(3);
  initNav();
  showNameModal();
};
</script>
